<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fan Page</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <h1>My Fan Page</h1>

  <div class="card">
    <p>
      I really like <b>Ryan Trahan</b> because he is so down to earth, friendly,
      and always positive. Watching his videos genuinely felt like he's just one of us, bring
      positivity to others!
    </p>

    <button onclick="likeRyan()">Click if you like Ryan too!</button>
    <div id="hearts"></div>

    <button onclick="showFunFact()">Show me a fun fact</button>
    <p id="funFact"></p>
  </div>

  <script>
    let likeCount = 0;

    function likeRyan() {
      likeCount++;
      document.getElementById("hearts").textContent =
        "❤️".repeat(likeCount) + "  (" + likeCount + " likes)";
    }

    const funFacts = [
      "Ryan Trahan started his channel back in high school!",
      "He's known for his 1 penny style challenge videos.",
      "He's travelled 50 states in 50 days, while making the series a charity for his fans",
      "He once survived on a deserted island for content!"
    ];

    function showFunFact() {
      const randomFact = funFacts[Math.floor(Math.random() * funFacts.length)];
      document.getElementById("funFact").textContent = randomFact;
    }
  </script>

</body>
</html>
