<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>It's me</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <!-- External CSS -->
    <link rel="stylesheet" href="public/css/style.css" />
  </head>
  <body class="my-4">
    <section class="row" id="header">
      <div class="col-2 position-relative" id="profile-img-section">
        <img id="profile-img" src="public/img/profile.jpeg" alt="It's me" />
        <img id="jeff-img" src="public/img/jeff.jpg" alt=":)">
      </div>
      
      <div class="col-10 position-relative">
        <h1 id="my-name">Tan Yan Tat</h1>
        <div id="bio">
          <p>I cycle and swim sometimes. When I'm not, I am mostly glued to my chair, typing away on VSCode to write something like this biography</p>
          <button onclick="getJeff(this)" id="trigger-jeff-btn" class="btn btn-sm btn-outline-secondary position-absolute">:)</button>
        </div>
      </div>
    </section>

    <section id="travel">
      <h2 class="mt-4">My Favourite Destination For Travelling</h2>
      <iframe width="560" height="315" 
        src="https://www.youtube.com/embed/1zFy0MDIwB4?si=qDItv6gGHdSGAOg3" title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen
    ></iframe>
    </section>

    <section id="deliverables">
        <h2 class="mt-4">Weekly Deliverables</h2>
        <div id="deliverables-grid">
          <a href="Week 1/fanpage.html" class="btn folder">
            Week 1 - Fan Page
          </a>
          <a href="Week 2/Challenge1/home.html" class="btn folder">
            Week 2 - Challenge 1
          </a>
          <a href="Week 2/Challenge2/home.html" class="btn folder">
            Week 2 - Challenge 2
          </a>
          <a href="Week 2/Challenge3/home.html" class="btn folder">
            Week 2 - Challenge 3
          </a>
        </div>
    </section>

    <footer></footer>
  </body>

  <script>
    let seenJeff = false;

    async function getJeff(btn) {
      if (!seenJeff) {
        let confirmJeff = confirm("It's me?");
        let body = document.querySelector('body');
        let jeffImg = document.querySelector("#jeff-img");
        let nameh1 = document.querySelector("#my-name");

        await setTimeout(() => {
          let oriName = nameh1.innerText;
          let oriColor = nameh1.style.color;

          jeffImg.style.display = 'block';
          body.style.backgroundColor = 'black';
          setTimeout(() => {
            nameh1.innerText = "It's me";
            nameh1.style.color = 'white';
          }, 750);
          setTimeout(() => {
            jeffImg.style.height = '500%';
            jeffImg.style.width = '500%';
          }, 1500)
          setTimeout(() => {
            body.style.backgroundColor = 'white';
            jeffImg.style.display = 'none';
            jeffImg.style.height = '100%';
            jeffImg.style.width = '100%';
            nameh1.innerText = oriName;
            nameh1.style.color = oriColor;
          }, 1750)
        }, 1000);

        seenJeff = true;
      } else {
        btn.innerText = ':(';
      }
    }
  </script>
</html>
